<!-- Export: screenshot the 1080x1080 .ad-stage to PNG. Swap the text wordmark for the real logo when available. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monstro Ad 3 — The Agency Cycle</title>
<link rel="stylesheet" href="../../assets/brand.css">
<style>
  html, body { background: #334155; }
  body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; }

  .ad-stage {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    background: var(--slate-950);
    color: var(--white);
    padding: 84px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    font-family: var(--font-body);
  }
  /* subtle indigo glow */
  .ad-stage::before {
    content: "";
    position: absolute;
    top: -260px; right: -200px;
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(79,70,229,.45), transparent 65%);
    pointer-events: none;
  }
  .ad-stage > * { position: relative; z-index: 1; }

  .wordmark {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.03em;
    color: var(--white);
    line-height: 1;
  }
  .wordmark .o { color: var(--indigo-500); }

  .eyebrow-tag {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-head);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .14em;
    font-size: 22px;
    color: var(--indigo-500);
    margin-top: 72px;
  }
  .cycle-loop {
    width: 30px; height: 30px;
    border: 4px solid var(--indigo-500);
    border-top-color: transparent;
    border-radius: 999px;
    position: relative;
  }
  .cycle-loop::after {
    content: "";
    position: absolute;
    top: -4px; right: -2px;
    border-left: 9px solid var(--indigo-500);
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    transform: rotate(35deg);
  }

  .headline {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 90px;
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: var(--white);
    margin-top: 22px;
  }
  .headline .num { color: var(--indigo-500); }

  .support {
    font-family: var(--font-body);
    font-size: 31px;
    line-height: 1.45;
    color: #cbd5e1;
    margin-top: 36px;
    max-width: 880px;
  }
  .support b { color: var(--white); font-weight: 700; }
  .support .own { color: var(--indigo-500); font-weight: 700; }

  .spacer { flex: 1 1 auto; }

  .cta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .cta-pill {
    display: inline-block;
    background: var(--indigo-600);
    color: var(--white);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 32px;
    padding: 26px 46px;
    border-radius: 999px;
    box-shadow: 0 14px 34px rgba(79,70,229,.5);
    white-space: nowrap;
  }
  .site-tag {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 26px;
    color: rgba(255,255,255,.55);
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="ad-stage">
    <div class="wordmark">MONSTR<span class="o">O</span></div>

    <div class="eyebrow-tag"><span class="cycle-loop"></span> The rented-channel trap</div>

    <div class="headline">
      On your <span class="num">3rd</span> marketing agency in <span class="num">2</span> years?
    </div>

    <div class="support">
      It's not the agency. <b>Ads are a rented channel.</b> The music schools that break the cycle <span class="own">own their local search.</span>
    </div>

    <div class="spacer"></div>

    <div class="cta-row">
      <span class="cta-pill">Break the cycle →</span>
      <span class="site-tag">mymonstro.com</span>
    </div>
  </div>
</body>
</html>
